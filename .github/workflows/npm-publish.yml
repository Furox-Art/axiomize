name: npm Publish

# npm trusts this workflow file. Automatic and recovery runs publish from the
# GitHub release tag after PyPI serves the same version.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to publish, without the v prefix (checkout is tag v<version>), for example 1.14.2"
        required: true
        type: string
      reason:
        description: "Why this manual npm publish is needed"
        required: true
        type: string
      use_token_fallback:
        description: "Publish with the NPM_TOKEN secret instead of OIDC trusted publishing. Drops the provenance attestation."
        required: false
        default: false
        type: boolean

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release_gate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve the completed PyPI release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          data="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '[.head_sha, .event, .head_branch, .conclusion, .repository.full_name, .head_repository.full_name, .path] | @tsv')"
          IFS=$'\t' read -r sha event branch conclusion repo head_repo path <<< "$data"
          if [[ "$path" != ".github/workflows/release.yml" || "$branch" != "main" ||
                "$repo" != "$GITHUB_REPOSITORY" || "$head_repo" != "$GITHUB_REPOSITORY" ||
                "$conclusion" != "success" || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Run $RUN_ID is not a successful Release run from this repository's main branch."
            exit 1
          fi
          case "$event" in
            push|workflow_dispatch) ;;
            *) echo "::error::Unexpected Release event: $event"; exit 1 ;;
          esac
          published="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "publish") | .conclusion] | first // "missing"')"
          if [[ "$published" != "success" ]]; then
            echo "::error::The PyPI publish job for run $RUN_ID did not succeed."
            exit 1
          fi
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$sha" --jq .content \
            | base64 --decode | jq -er '.version | strings | select(length > 0)')"
          git check-ref-format "refs/tags/v$version"
          printf 'sha=%s\nversion=%s\n' "$sha" "$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: release_gate
    if: |
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
        (needs.release_gate.result == 'success' && needs.release_gate.outputs.version != ''))
    env:
      PUBLISH_VERSION: ${{ inputs.version || needs.release_gate.outputs.version }}
      RELEASE_SHA: ${{ needs.release_gate.outputs.sha }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/axiomize
    # id-token:write mints the OIDC token for the default trusted-publishing
    # path. contents:read is for the checkout. contents:write is not needed to
    # publish and is not granted.
    #
    # The token fallback path reads secrets.NPM_TOKEN, a long-lived credential.
    # The trusted publisher is registered and OIDC is the default; the token
    # path remains only as a fallback for registry incidents.
    permissions:
      contents: read
      id-token: write
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: Validate the workflow ref and release version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -n "$PUBLISH_VERSION"
          git check-ref-format "refs/tags/v$PUBLISH_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ env.PUBLISH_VERSION }}
          # Full history is needed to prove the tag commit is contained in main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1;
          # Node 20 ships npm 10.x, which cannot do OIDC at all. Required for
          # BOTH modes, because npm 11 is also where the CLI's OIDC detection
          # and `--provenance` behaviour stabilised.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never cache in a release build: a warm cache is a way to publish
          # bytes this checkout did not produce.
          package-manager-cache: false
      - name: Report the manual publish reason
        if: github.event_name == 'workflow_dispatch'
        # Passed through the environment, never interpolated into the script:
        # a write-access dispatcher controls this string.
        env:
          REASON: ${{ inputs.reason }}
        run: |
          printf 'manual npm publish requested: %s\n' "$REASON"
      - name: Enforce release version contract
        run: python .github/scripts/check_release_contract.py
      - name: Verify the release tag, its ancestry and the PyPI release
        shell: bash
        env:
          PYPI_PROJECT: axiomize
        run: |
          set -euo pipefail
          version="$PUBLISH_VERSION"
          actual="$(node -p "require('./package.json').version")"
          if [ "${actual}" != "${version}" ]; then
            echo "::error::Tag v${version} carries package.json version ${actual}."
            exit 1
          fi
          if [[ -n "$RELEASE_SHA" && "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::Tag v$version does not match the successful Release run's commit."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release commit $(git rev-parse HEAD) is not on main."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          project = os.environ["PYPI_PROJECT"]
          version = os.environ["PUBLISH_VERSION"]
          url = f"https://pypi.org/pypi/{project}/{version}/json"
          attempts = 90
          delay = 10
          last_error = None
          for attempt in range(1, attempts + 1):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response)
                  break
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  last_error = error
              except OSError as error:
                  last_error = error
              print(f"PyPI {project} {version} is not live yet (attempt {attempt}/{attempts}): {last_error}")
              time.sleep(delay)
          else:
              raise SystemExit(
                  f"FAIL: PyPI {project} {version} is not live after "
                  f"{attempts * delay}s ({last_error!r}); refusing to publish npm"
              )
          if data["info"]["version"] != version:
              raise SystemExit(
                  f"FAIL: PyPI reports version {data['info']['version']!r}, expected {version!r}"
              )
          print(f"PASS: {project} {version} is live on PyPI; npm may publish")
          PY
      - name: Verify the toolchain supports the selected auth mode
        id: toolchain
        # Numeric semver comparison, not a regex. A pattern such as
        # ^11\.(5[1-9]|[6-9][0-9])\.|^1[2-9]\. is wrong twice over: it rejects
        # 11.5.1 and 11.19.0 (both of which satisfy >= 11.5.1) and accepts only
        # 11.99.0 and 12+ within the 11 line. Compared as (major, minor, patch)
        # integers instead.
        run: |
          set -euo pipefail
          node -e '
            // `node --version` prints a leading "v" ("v24.14.0"); npm does not.
            // A pre-release suffix is ignored: only (major, minor, patch) matter
            // for the minimum-version comparison.
            const semver = (raw) => {
              const m = /^v?(\d+)\.(\d+)\.(\d+)/.exec(String(raw).trim());
              if (!m) return null;
              return [Number(m[1]), Number(m[2]), Number(m[3])];
            };
            const gte = (a, b) => a[0] !== b[0] ? a[0] > b[0] : (a[1] !== b[1] ? a[1] > b[1] : a[2] >= b[2]);
            const npmRaw = process.argv[1];
            const npmVer = semver(npmRaw);
            if (!npmVer) { console.error(`FAIL: cannot parse npm version ${npmRaw}`); process.exit(1); }
            const nodeRaw = process.argv[2];
            const nodeVer = semver(nodeRaw);
            if (!nodeVer) { console.error(`FAIL: cannot parse node version ${nodeRaw}`); process.exit(1); }
            const NPM_MIN = [11, 5, 1];
            const NODE_MIN = [22, 14, 0];
            if (!gte(npmVer, NPM_MIN)) {
              console.error(`FAIL: npm ${npmRaw} is older than the required ${NPM_MIN.join(".")}; trusted publishing cannot work`);
              process.exit(1);
            }
            if (!gte(nodeVer, NODE_MIN)) {
              console.error(`FAIL: node ${nodeRaw} is older than the required ${NODE_MIN.join(".")}`);
              process.exit(1);
            }
            console.log(`PASS npm ${npmRaw} >= ${NPM_MIN.join(".")}, node ${nodeRaw} >= ${NODE_MIN.join(".")}`);
          ' "$(npm --version)" "$(node --version)"
          echo "npm_version=$(npm --version)" >> "$GITHUB_OUTPUT"
          echo "node_version=$(node --version)" >> "$GITHUB_OUTPUT"
      - name: Select the publish credential mode
        id: select-mode
        # OIDC is the default and the target state. The token path is an
        # explicit, opt-in fallback for registry incidents. Both are fail-closed:
        # each fails with a specific message rather than silently degrading to
        # whichever credential happens to be present.
        run: |
          set -euo pipefail
          if [ "${{ inputs.use_token_fallback }}" = "true" ]; then
            mode=token
          else
            mode=oidc
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          if [ "$mode" = "oidc" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "::error::OIDC publish requested but this job cannot mint an OIDC token."
              echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is unset, so the runner did not grant id-token:write."
              echo "::error::Either fix the id-token:write permission, or re-run with use_token_fallback=true to publish with NPM_TOKEN instead."
              exit 1
            fi
            echo "mode=oidc (provenance attestation enabled)"
          else
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "::error::Token publish requested but the NPM_TOKEN secret is empty."
              echo "::error::Add a repository or npm-environment secret named NPM_TOKEN (an npm automation token), or re-run without use_token_fallback once the trusted publisher is registered."
              exit 1
            fi
            echo "mode=token via NPM_TOKEN (no provenance: a long-lived token cannot mint a Sigstore attestation)"
            echo "::warning::Publishing with NPM_TOKEN instead of OIDC. Register the npmjs.com trusted publisher and delete NPM_TOKEN once this release is out."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Parse every shipped JavaScript file
        run: |
          node --check index.js
          node --check bin/axiomize.js
          node --check tests/npm/contract.test.js
      - name: npm package contract tests
        run: npm test
      - name: npm/Python version lockstep and registry state
        id: registry
        run: python .github/scripts/npm_release_contract.py --registry-state
      - name: Assert the tarball contains only the allowlisted files
        run: |
          set -euo pipefail
          npm pack --dry-run --json | python -c "
          import json, sys
          names = sorted(e['path'] for e in json.load(sys.stdin)[0]['files'])
          print('packed files:')
          for name in names:
              print('  ' + name)
          expected = {
              'index.js', 'bin/axiomize.js', 'package.json',
              'LICENSE', 'README.md', 'tests/npm/contract.test.js',
          }
          actual = set(names)
          missing = expected - actual
          if missing:
              raise SystemExit(f'FAIL: npm tarball is missing {sorted(missing)}')
          extra = actual - expected
          if extra:
              raise SystemExit(f'FAIL: npm tarball has unexpected files {sorted(extra)}')
          print(f'PASS npm tarball contains exactly the {len(names)} allowlisted files')
          "
      - name: Choose the npm dist-tag
        id: disttag
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "::notice::Publishing ${version} under the '${tag}' dist-tag."
      - name: Publish to npm (OIDC trusted publishing)
        if: steps.select-mode.outputs.mode == 'oidc' && steps.registry.outputs.exists != 'true'
        # No NODE_AUTH_TOKEN: npm's CLI authenticates from this job's OIDC
        # identity. Provenance is generated automatically for OIDC publishes
        # from a public repository; --provenance is explicit so the attestation
        # survives a future change to that default. No continue-on-error: a
        # failed publish must fail loudly rather than let the registries drift.
        run: npm publish --provenance --access public --tag "${{ steps.disttag.outputs.tag }}"
      - name: Publish to npm (NPM_TOKEN fallback)
        if: steps.select-mode.outputs.mode == 'token' && steps.registry.outputs.exists != 'true'
        # --provenance is deliberately absent: provenance is backed by a Sigstore
        # attestation derived from the OIDC identity, and a long-lived token
        # cannot mint one. Passing the flag here would fail the publish.
        run: npm publish --access public --tag "${{ steps.disttag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}