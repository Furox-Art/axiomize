name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Deterministic SIR checks
        run: python tools/validate.py --model sir --beta 0.3 --gamma 0.1
      - name: Stochastic (Gillespie) checks
        run: python tools/validate.py --model gillespie --N 10000 --I0 1 --runs 300
      - name: Queue (Erlang-C) checks
        run: python tools/validate.py --model queue --lam 60 --mu 20 --target-wait 3
