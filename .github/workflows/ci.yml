name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile source tree
        run: python -m compileall -q src skills tests .github/scripts
      - name: Enforce source/workflow security contract
        run: python .github/scripts/security_contract_smoke.py
      - name: Stage docs pages
        run: python .github/scripts/stage_docs.py
      - name: Build documentation in strict mode
        run: pip install mkdocs-material && python -m mkdocs build --strict
      - name: Audit declared Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip_audit -r requirements-test.txt

  npm-package:
    name: npm-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Parse every shipped JavaScript file
        # The published npm shim shipped with a truncated arrow function in
        # index.js (`proc.on('close', (code) =; }`). Nothing in CI ever parsed
        # JavaScript, so `node --check` was never run and a SyntaxError reached
        # the registry as axiomize@1.12.2.
        run: |
          node --check index.js
          node --check bin/axiomize.js
          node --check tests/npm/contract.test.js
      - name: npm package contract tests
        run: npm test
      - name: npm/Python version lockstep and packaging contract
        run: python .github/scripts/npm_release_contract.py
      - name: Verify the npm tarball contents
        # The manifest gained a `files` allowlist because npm previously fell
        # back to .gitignore and packed the entire checkout: 266 entries
        # including .github/, the Python sources, the docs and a 248 KB GIF.
        run: |
          set -euo pipefail
          npm pack --dry-run --json | python -c "
          import json, sys
          entries = json.load(sys.stdin)[0]['files']
          names = sorted(e['path'] for e in entries)
          print('packed files:')
          for name in names:
              print('  ' + name)
          required = {'index.js', 'bin/axiomize.js', 'package.json', 'LICENSE', 'README.md'}
          missing = required - set(names)
          if missing:
              raise SystemExit(f'FAIL: npm tarball is missing {sorted(missing)}')
          allowed_prefixes = ('tests/npm/',)
          forbidden_prefixes = ('.github/', 'src/', 'docs/', 'benchmarks/', 'packs/', 'skills/')
          leaked = [
              n for n in names
              if n.startswith(forbidden_prefixes)
              and not n.startswith(allowed_prefixes)
          ]
          if leaked:
              raise SystemExit(f'FAIL: npm tarball leaked non-package files: {leaked}')
          print(f'PASS npm tarball contains exactly the {len(names)} intended files')
          "

  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned quality tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.16.9" "mypy==2.3.1" pytest pytest-cov
      - name: Install the package under test
        # The suite imports `axiomize` and the force-included skill tools. An
        # editable install plus the repo-root conftest.py is what makes a single
        # test file runnable on its own; see conftest.py for why both paths exist.
        run: python -m pip install -e ".[dev]"
      - name: Test suite with coverage
        run: |
          python -m pytest tests/ -q --cov=axiomize --cov-report=xml --cov-report=term
      - name: Ruff and mypy ratchet
        # Ratchet, not a zero-findings gate: fails when lint findings, type
        # errors or coverage get worse than .github/quality-baseline.json.
        run: python .github/scripts/quality_ratchet.py

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Install the package under test
        # Previously the suite only worked because some test modules happened to
        # mutate sys.path, and only when collection order cooperated.
        run: python -m pip install -e ".[dev]"
      - name: Validate dependency graph
        run: python -m pip check
      - name: Source import graph contract
        run: python .github/scripts/import_contract_smoke.py --source
      - name: Run test suite
        run: pytest tests/ -v
      - name: Skill lint (frontmatter + links + compile)
        run: python skills/axiomize/tools/check_skill.py
      - name: Deterministic SIR checks
        run: python skills/axiomize/tools/validate.py --model sir --beta 0.3 --gamma 0.1
      - name: Stochastic (Gillespie) checks
        run: python skills/axiomize/tools/validate.py --model gillespie --N 10000 --I0 1 --runs 300
      - name: Stochastic subcritical/critical regression (fade-out theory)
        run: |
          python skills/axiomize/tools/validate.py --model gillespie --beta 0.05 --gamma 0.1 --I0 1 --N 10000 --runs 400
          python skills/axiomize/tools/validate.py --model gillespie --beta 0.1 --gamma 0.1 --I0 3 --N 10000 --runs 400
      - name: Queue (Erlang-C) checks
        run: python skills/axiomize/tools/validate.py --model queue --lam 60 --mu 20 --target-wait 3
      - name: Calibration selftests
        run: |
          python skills/axiomize/tools/fit.py --model sir --selftest
          python skills/axiomize/tools/fit.py --model logistic --selftest
      - name: Parallel sweep engine
        run: |
          python skills/axiomize/tools/parallel_sweep.py --job sweep
          python skills/axiomize/tools/parallel_sweep.py --job mc
      - name: Benchmark regression (stored blind-test reports)
        run: |
          ids="$(python -c "import json; print(' '.join(c['id'] for c in json.load(open('benchmarks/ideas.json', encoding='utf-8'))['cases']))")"
          echo "grading cases: $ids"
          for id in $ids; do
            python skills/axiomize/tools/benchmark_runner.py --case "$id" --report "benchmarks/reports/$id.md" || exit 1
          done

  installed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Enforce release version contract
        run: python .github/scripts/check_release_contract.py
      - name: Enforce npm package contract
        run: python .github/scripts/npm_release_contract.py
      - name: Build and install the exact wheel artifact
        # build is pinned to the version release.yml uses, so this job and the
        # release produce the same wheel from the same source.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1"
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Installed package import graph contract
        run: python .github/scripts/import_contract_smoke.py --installed
      - name: Full installed CLI contract
        run: python .github/scripts/cli_release_smoke.py
      - name: Documented README/docs claims match the installed package
        run: python .github/scripts/readme_example_check.py
      - name: General Model IR installed contract
        run: python .github/scripts/general_model_release_smoke.py
      - name: Advanced Model IR installed CLI contract
        run: python .github/scripts/advanced_family_release_smoke.py
      - name: Versioned portable export installed contract
        run: python .github/scripts/portable_export_release_smoke.py
      - name: Validated surrogate installed contract
        run: python .github/scripts/surrogate_release_smoke.py
      - name: Scientific all-family stress matrix
        run: python .github/scripts/scientific_stress_gate.py
      - name: Real LaTeX console conversion
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf '# Release Smoke\n\nModel relation: $y = ax + b$.\n' > "$tmp/report.md"
          axiomize-to-latex --input "$tmp/report.md" --output "$tmp/report.tex"
          test -s "$tmp/report.tex"
          grep -F '\begin{document}' "$tmp/report.tex"
          grep -F 'Model relation' "$tmp/report.tex"

  platform-wheel-cli:
    name: wheel-cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Build exact wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1"
          python -m build --wheel
      - name: Install and smoke real wheel + CLI
        run: python .github/scripts/platform_wheel_cli_smoke.py --wheel-dir dist
