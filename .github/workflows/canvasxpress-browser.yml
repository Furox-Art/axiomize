name: CanvasXpress browser audit

on:
  pull_request:
    paths:
      - "src/axiomize/visualization/canvasxpress_export.py"
      - "src/axiomize/visualization/mcp_charts.py"
      - "tests/test_canvasxpress_export.py"
      - "tests/test_canvasxpress_mcp.py"
      - "scripts/canvasxpress_browser_audit.py"
      - ".github/workflows/canvasxpress-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-render:
    name: CanvasXpress real-browser layout comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Axiomize
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout exact upstream CanvasXpress JavaScript runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: neuhausi/canvasxpress-js
          ref: 76a2074800474700f151c8bf9c6d6bd07a0d7717
          path: external/canvasxpress-js
          sparse-checkout: |
            src
          persist-credentials: false

      - name: Install Python browser-audit dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Axiomize and headless browser driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . playwright

      - name: Render original and corrected JSON with the real CanvasXpress library
        run: |
          python scripts/canvasxpress_browser_audit.py

      - name: Preserve screenshot, JSON report and replayable HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvasxpress-browser-comparison
          path: browser-audit/
          if-no-files-found: warn
