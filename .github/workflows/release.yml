name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/pypi-release-trigger"
  workflow_dispatch:

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.meta.outputs.name }}
      package_version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the release commit can be proven to sit on main.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Require the release commit to be the current main tip
        # A workflow_dispatch can target a branch name; this refuses an older
        # checkout even when the branch is spelled "main". Publishing an
        # untested older commit is not recoverable on PyPI.
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "::error::release commit $(git rev-parse HEAD) is not the current origin/main tip $(git rev-parse FETCH_HEAD)"
            exit 1
          }
      - name: Enforce release version contract
        run: python .github/scripts/check_release_contract.py
      - name: Verify documented provenance claims against the live registries
        # The provenance guard belongs beside the other version guards in the
        # release workflow, not only in CI. A release publishes a version whose
        # documented provenance state must still match the registries, and a
        # registry that cannot be reached fails here rather than silently
        # green-lighting the claim.
        run: python .github/scripts/check_provenance_claims.py
      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"name={data['project']['name']}")
          print(f"version={data['project']['version']}")
          PY
      - name: Install test, build and security tooling
        # build/twine/pip-audit are pinned exactly. twine <= 6.2.0 replaces
        # packaging's metadata-version list at import time, so packaging's
        # knowledge of Metadata-Version 2.5 is discarded and `twine check
        # --strict` rejects valid artifacts with "'2.5' is not a valid metadata
        # version". This repository emits 2.5 (PEP 639 license keys in
        # pyproject.toml), so the gate's outcome must not depend on what pip
        # resolves that day. .github/scripts/release_toolchain_guard.py enforces
        # the pins, the floor, and that the toolchain still validates 2.5.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install "build==1.6.1" "twine==7.0.0" "pip-audit==2.10.1"
      - name: Verify the release toolchain can validate our metadata
        # Runs before the build so a bad toolchain is reported before artifacts
        # exist, rather than as a confusing `twine check` failure afterwards.
        run: python .github/scripts/release_toolchain_guard.py
      - name: Validate dependency graph
        run: python -m pip check
      - name: Security contract
        run: python .github/scripts/security_contract_smoke.py
      - name: Audit declared dependencies
        run: python -m pip_audit -r requirements-test.txt
      - name: Source import graph contract
        run: python .github/scripts/import_contract_smoke.py --source
      - name: Install the project for subprocess tests
        # Parts of the suite spawn fresh interpreters from temporary
        # directories, where pytest's rootdir insertion does not apply.
        run: python -m pip install --no-deps -e .
      - name: Run tests with zero skipped cases
        run: |
          python -m pytest tests/ -q --junitxml=pytest-release.xml
          python .github/scripts/assert_no_skips.py pytest-release.xml
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        # --strict is load-bearing: without it twine's warnings do not fail the
        # release, and a long_description that PyPI cannot render ships anyway.
        run: python -m twine check --strict dist/*
      - name: Assert both wheel and sdist were produced
        # `python -m build` can silently produce only one artifact; publishing a
        # half-built release is not recoverable, so assert both exist here.
        run: |
          set -euo pipefail
          test -n "$(ls dist/*.whl 2>/dev/null)" || { echo "::error::no wheel in dist/"; exit 1; }
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "::error::no sdist in dist/"; exit 1; }
          ls -l dist/
      - name: Install exact release wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Installed package import graph contract
        run: python .github/scripts/import_contract_smoke.py --installed
      - name: Full installed CLI contract
        run: python .github/scripts/cli_release_smoke.py
      - name: General Model IR installed contract
        run: python .github/scripts/general_model_release_smoke.py
      - name: Advanced Model IR installed CLI contract
        run: python .github/scripts/advanced_family_release_smoke.py
      - name: Versioned portable export installed contract
        run: python .github/scripts/portable_export_release_smoke.py
      - name: Validated surrogate installed contract
        run: python .github/scripts/surrogate_release_smoke.py
      - name: Scientific all-family stress matrix
        run: python .github/scripts/scientific_stress_gate.py
      - name: Real LaTeX console conversion
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf '# Release Smoke\n\nModel relation: $y = ax + b$.\n' > "$tmp/report.md"
          axiomize-to-latex --input "$tmp/report.md" --output "$tmp/report.tex"
          test -s "$tmp/report.tex"
          grep -F '\begin{document}' "$tmp/report.tex"
          grep -F 'Model relation' "$tmp/report.tex"
      - name: Generate SBOM for the release artifacts
        # A released artifact with no known dependency inventory cannot be
        # triaged later. The SBOM is generated from the exact dist/ contents
        # that are about to be published, and uploaded with them.
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: dist/axiomize-${{ steps.meta.outputs.version }}.sbom.spdx.json
      - name: Preserve tested distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  platform-smoke:
    name: release wheel-cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Enforce release version contract
        run: python .github/scripts/check_release_contract.py
      - name: Enforce npm package contract
        run: python .github/scripts/npm_release_contract.py
      - name: Verify documented provenance claims against the live registries
        # Registered here beside the other version guards so a release cannot
        # publish a version whose documented provenance state the registry
        # contradicts. A network failure fails this step; it never skips.
        run: python .github/scripts/check_provenance_claims.py
      - name: Build exact wheel
        # build is pinned here too, for the same reason as in preflight: the
        # wheel these jobs install and smoke must be byte-identical to the one
        # preflight validated, and an unpinned build backend makes that depend on
        # the day.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1"
          python -m build --wheel
      - name: Install and smoke real wheel + CLI
        run: python .github/scripts/platform_wheel_cli_smoke.py --wheel-dir dist
      - name: Assert the platform wheel was produced
        # A runner that silently produced no wheel would otherwise leave this job
        # green with nothing to show. `python -m build` can exit 0 without the
        # expected artifact when the backend filters it out.
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(ls dist/*.whl 2>/dev/null)" || { echo "::error::no wheel in dist/ on ${{ matrix.os }}"; exit 1; }
          ls -l dist/
      - name: Preserve the platform packaging artifact
        # The published distributions come from preflight (Linux). Uploading the
        # wheel each runner built closes the silent Windows gap: the Windows
        # packaging path now produces an inspectable artifact instead of being
        # asserted only through the smoke run and then discarded. These artifacts
        # are deliberately NOT what `publish` uploads to PyPI; `publish` still
        # consumes only preflight's `python-package-distributions`.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  publish:
    # The npm Publish workflow waits for this workflow to complete.
    needs: [preflight, platform-smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.preflight.outputs.package_name }}/${{ needs.preflight.outputs.package_version }}/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist
      - name: Separate the SBOM from the PyPI distributions
        # The SBOM is a GitHub-release asset, not a distribution: uploading it
        # to PyPI would fail. The earlier version deleted it here and then
        # attached dist/*.sbom.spdx.json to the release, so every release was
        # missing the inventory it claimed to ship.
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mv dist/*.sbom.spdx.json release-assets/
          find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
      - name: Check whether this version is complete on PyPI
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          name="${{ needs.preflight.outputs.package_name }}"
          version="${{ needs.preflight.outputs.package_version }}"
          json_url="https://pypi.org/pypi/${name}/${version}/json"
          simple_url="https://pypi.org/simple/${name}/"
          complete=false
          state="$(mktemp)"
          if curl --retry 2 --retry-delay 2 -sfL "$json_url" -o "$state"; then
            if python - "$state" <<'PY'
          import json, pathlib, sys

          published = {
              entry["filename"]
              for entry in json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")).get("urls", [])
          }
          expected = {
              path.name
              for path in pathlib.Path("dist").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          }
          missing = sorted(expected - published)
          if missing:
              print("missing from PyPI: " + ", ".join(missing))
              sys.exit(1)
          print("PyPI already serves every expected file: " + ", ".join(sorted(expected)))
          PY
            then
              complete=true
            fi
          else
            # The JSON API answers 404 for a version the CDN has not caught up
            # with; the Simple API lists the files. Match whole filenames, not
            # a prefix: "axiomize-1.14.1" is a substring of "axiomize-1.14.10".
            listing="$(mktemp)"
            if curl --retry 2 --retry-delay 2 -sfL "$simple_url" -o "$listing"; then
              complete=true
              for file in dist/*.whl dist/*.tar.gz; do
                [ -e "$file" ] || continue
                base="$(basename "$file")"
                if ! grep -Fq "/${base}#" "$listing"; then
                  complete=false
                  echo "Simple API is missing ${base}."
                  break
                fi
              done
            fi
            rm -f "$listing"
          fi
          rm -f "$state"
          echo "skip=$complete" >> "$GITHUB_OUTPUT"
      - name: Publish to PyPI with Trusted Publishing and provenance
        if: steps.gate.outputs.skip != 'true'
        # No token fallback and no continue-on-error: a long-lived token cannot
        # mint a PEP 740 attestation, and the README promises one for every
        # release. An unconfigured trusted publisher must fail the run.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          # Only reachable when the gate found a missing file, so this uploads
          # the missing half of a partial release rather than re-uploading an
          # existing file.
          skip-existing: true
      - name: Wait until every published file is served by PyPI
        shell: bash
        run: |
          set -euo pipefail
          name="${{ needs.preflight.outputs.package_name }}"
          version="${{ needs.preflight.outputs.package_version }}"
          json_url="https://pypi.org/pypi/${name}/${version}/json"
          for attempt in 1 2 3 4 5 6; do
            state="$(mktemp)"
            if curl -sfL "$json_url" -o "$state"; then
              if python - "$state" <<'PY'
          import json, pathlib, sys

          published = {
              entry["filename"]
              for entry in json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")).get("urls", [])
          }
          expected = {
              path.name
              for path in pathlib.Path("dist").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          }
          missing = sorted(expected - published)
          if missing:
              print("still missing: " + ", ".join(missing))
              sys.exit(1)
          print("PyPI serves every expected file: " + ", ".join(sorted(expected)))
          PY
              then
                rm -f "$state"
                exit 0
              fi
            fi
            rm -f "$state"
            sleep 10
          done
          echo "::error::PyPI accepted the upload, but ${name} ${version} or one of its files is not visible after 60 seconds."
          echo "::error::Re-run the workflow: the existence gate is idempotent and will verify the published files."
          exit 1

      - name: Require a PEP 740 attestation for every published file
        shell: bash
        run: |
          set -euo pipefail
          project="${{ needs.preflight.outputs.package_name }}"
          version="${{ needs.preflight.outputs.package_version }}"
          for file in dist/*.whl dist/*.tar.gz; do
            [ -e "$file" ] || continue
            base="$(basename "$file")"
            url="https://pypi.org/integrity/${project}/${version}/${base}/provenance"
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" != "200" ]; then
              echo "::error::No PEP 740 attestation for ${base} (HTTP ${code}): ${url}"
              exit 1
            fi
            echo "attested: ${base}"
          done
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ needs.preflight.outputs.package_version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(needs.preflight.outputs.package_version, '-') }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-assets/*.sbom.spdx.json
