name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/pypi-release-trigger"

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.meta.outputs.name }}
      package_version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Enforce release version contract
        run: python .github/scripts/check_release_contract.py
      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"name={data['project']['name']}")
          print(f"version={data['project']['version']}")
          PY
      - name: Install test and build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install build twine
      - name: Run tests
        run: pytest tests/ -q
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install exact release wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Full installed CLI contract
        run: python .github/scripts/cli_release_smoke.py
      - name: Preserve tested distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.preflight.outputs.package_name }}/${{ needs.preflight.outputs.package_version }}/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist
      - name: Check whether version already exists on PyPI
        id: gate
        shell: bash
        run: |
          if curl -sfL "https://pypi.org/pypi/${{ needs.preflight.outputs.package_name }}/${{ needs.preflight.outputs.package_version }}/json" > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect API token fallback
        id: auth
        if: steps.gate.outputs.skip != 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI with Trusted Publishing
        id: trusted_publish
        if: steps.gate.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
      - name: Publish to PyPI with API token fallback
        id: token_publish
        if: steps.gate.outputs.skip != 'true' && steps.trusted_publish.outcome != 'success' && steps.auth.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
        continue-on-error: true
      - name: Fail clearly when PyPI authentication is not configured
        if: steps.gate.outputs.skip != 'true' && steps.trusted_publish.outcome != 'success' && steps.auth.outputs.has_token != 'true'
        shell: bash
        run: |
          echo "::error::PyPI authentication is not configured for this release."
          echo "::error::Configure a PyPI Trusted Publisher with owner=Furox-Art, repository=axiomize, workflow=release.yml, environment=pypi; or define the PYPI_API_TOKEN secret in the pypi environment."
          exit 1
      - name: Verify PyPI publication
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://pypi.org/pypi/${{ needs.preflight.outputs.package_name }}/${{ needs.preflight.outputs.package_version }}/json"
          for attempt in 1 2 3 4 5 6; do
            if curl -sfL "$url" > /dev/null; then
              echo "PyPI publication verified: $url"
              exit 0
            fi
            sleep 10
          done
          echo "Trusted publishing outcome: ${{ steps.trusted_publish.outcome }}"
          echo "Token fallback outcome: ${{ steps.token_publish.outcome }}"
          exit 1
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.preflight.outputs.package_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
