name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/pypi-release-trigger"
  # A manual run can pick the npm credential mode explicitly. The automatic push
  # trigger cannot carry dispatch inputs, so for that path the mode comes from
  # the `npm_publish_mode` repository variable instead.
  workflow_dispatch:
    inputs:
      use_token_fallback:
        description: "Publish the npm shim with the NPM_TOKEN secret instead of OIDC trusted publishing. Drops the provenance attestation."
        required: false
        default: false
        type: boolean

concurrency:
  group: pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.meta.outputs.name }}
      package_version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Enforce release version contract
        run: python .github/scripts/check_release_contract.py
      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"name={data['project']['name']}")
          print(f"version={data['project']['version']}")
          PY
      - name: Install test, build and security tooling
        # build/twine/pip-audit are pinned exactly. twine <= 6.2.0 replaces
        # packaging's metadata-version list at import time, so packaging's
        # knowledge of Metadata-Version 2.5 is discarded and `twine check
        # --strict` rejects valid artifacts with "'2.5' is not a valid metadata
        # version". This repository emits 2.5 (PEP 639 license keys in
        # pyproject.toml), so the gate's outcome must not depend on what pip
        # resolves that day. .github/scripts/release_toolchain_guard.py enforces
        # the pins, the floor, and that the toolchain still validates 2.5.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install "build==1.6.1" "twine==7.0.0" "pip-audit==2.10.1"
      - name: Verify the release toolchain can validate our metadata
        # Runs before the build so a bad toolchain is reported before artifacts
        # exist, rather than as a confusing `twine check` failure afterwards.
        run: python .github/scripts/release_toolchain_guard.py
      - name: Validate dependency graph
        run: python -m pip check
      - name: Security contract
        run: python .github/scripts/security_contract_smoke.py
      - name: Audit declared dependencies
        run: python -m pip_audit -r requirements-test.txt
      - name: Source import graph contract
        run: python .github/scripts/import_contract_smoke.py --source
      - name: Run tests
        run: pytest tests/ -q
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        # --strict is load-bearing: without it twine's warnings do not fail the
        # release, and a long_description that PyPI cannot render ships anyway.
        run: python -m twine check --strict dist/*
      - name: Assert both wheel and sdist were produced
        # `python -m build` can silently produce only one artifact; publishing a
        # half-built release is not recoverable, so assert both exist here.
        run: |
          set -euo pipefail
          test -n "$(ls dist/*.whl 2>/dev/null)" || { echo "::error::no wheel in dist/"; exit 1; }
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "::error::no sdist in dist/"; exit 1; }
          ls -l dist/
      - name: Install exact release wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Validate installed dependency graph
        run: python -m pip check
      - name: Installed package import graph contract
        run: python .github/scripts/import_contract_smoke.py --installed
      - name: Full installed CLI contract
        run: python .github/scripts/cli_release_smoke.py
      - name: General Model IR installed contract
        run: python .github/scripts/general_model_release_smoke.py
      - name: Advanced Model IR installed CLI contract
        run: python .github/scripts/advanced_family_release_smoke.py
      - name: Versioned portable export installed contract
        run: python .github/scripts/portable_export_release_smoke.py
      - name: Validated surrogate installed contract
        run: python .github/scripts/surrogate_release_smoke.py
      - name: Scientific all-family stress matrix
        run: python .github/scripts/scientific_stress_gate.py
      - name: Real LaTeX console conversion
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf '# Release Smoke\n\nModel relation: $y = ax + b$.\n' > "$tmp/report.md"
          axiomize-to-latex --input "$tmp/report.md" --output "$tmp/report.tex"
          test -s "$tmp/report.tex"
          grep -F '\begin{document}' "$tmp/report.tex"
          grep -F 'Model relation' "$tmp/report.tex"
      - name: Generate SBOM for the release artifacts
        # A released artifact with no known dependency inventory cannot be
        # triaged later. The SBOM is generated from the exact dist/ contents
        # that are about to be published, and uploaded with them.
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/axiomize-${{ steps.meta.outputs.version }}.sbom.spdx.json
      - name: Preserve tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  npm-package:
    # The npm shim is published from the same release trigger as the Python
    # distributions, so it is part of the release contract rather than an
    # independent workflow that can drift. It previously ran in a separate
    # workflow keyed only on package.json changes, which is how package.json
    # ended up a release behind pyproject.toml.
    #
    # `needs: preflight` so a red Python test suite blocks the npm publish too.
    # Publishing npm green while PyPI is red would reintroduce exactly the
    # cross-registry drift this job exists to prevent.
    name: release npm-package
    needs: [preflight]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/axiomize
    # id-token:write mints the OIDC token for the default trusted-publishing
    # path. contents:read is for the checkout. contents:write is not needed to
    # publish and is not granted.
    #
    # The token fallback path reads secrets.NPM_TOKEN, a long-lived credential.
    # It exists because the npmjs.com trusted publisher is not registered yet;
    # once it is, the OIDC path is the only one that should be used and
    # NPM_TOKEN should be deleted from the repository.
    permissions:
      contents: read
      id-token: write
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1;
          # Node 20 ships npm 10.x, which cannot do OIDC at all. npm's own
          # reference workflow pins 24. Required for BOTH modes.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never cache in a release build: a warm cache is a way to publish
          # bytes that were not produced by this checkout.
          package-manager-cache: false
      - name: Select the publish credential mode
        id: select-mode
        # OIDC is the default and the target state. The token path is an
        # explicit fallback that exists only while the trusted publisher is
        # unregistered. Both are fail-closed: each fails with a specific message
        # rather than silently degrading to whichever credential happens to be
        # present.
        #
        # Mode resolution: a manual dispatch uses the `use_token_fallback` input;
        # an automatic push cannot carry inputs through `needs`, so it uses the
        # `npm_publish_mode` repository variable (unset or "oidc" by default).
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            requested="${{ inputs.use_token_fallback }}"
            [ "$requested" = "true" ] && mode=token || mode=oidc
          else
            mode="${{ vars.npm_publish_mode }}"
            case "$mode" in
              token) ;;
              ""|oidc) mode=oidc ;;
              *) echo "::error::vars.npm_publish_mode is '$mode'; expected 'oidc' or 'token'"; exit 1 ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

          if [ "$mode" = "oidc" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "::error::OIDC publish requested but this job cannot mint an OIDC token."
              echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is unset, so the runner did not grant id-token:write."
              echo "::error::Either fix the id-token:write permission, or set the repository variable npm_publish_mode=token to publish with NPM_TOKEN instead."
              exit 1
            fi
            echo "mode=oidc (provenance attestation enabled)"
          else
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "::error::Token publish requested but the NPM_TOKEN secret is empty."
              echo "::error::Add a repository or npm-environment secret named NPM_TOKEN (an npm automation token), or unset npm_publish_mode once the trusted publisher is registered."
              exit 1
            fi
            echo "mode=token via NPM_TOKEN (no provenance: a long-lived token cannot mint a Sigstore attestation)"
            echo "::warning::Publishing with NPM_TOKEN instead of OIDC. Register the npmjs.com trusted publisher and unset npm_publish_mode once this release is out."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify the toolchain supports the selected auth mode
        # Numeric semver comparison, not a regex. A pattern such as
        # ^11\.(5[1-9]|[6-9][0-9])\.|^1[2-9]\. is wrong twice over: it rejects
        # 11.5.1 and 11.19.0 (both of which satisfy >= 11.5.1) and accepts only
        # 11.99.0 and 12+ within the 11 line. Compared as (major, minor, patch)
        # integers instead.
        run: |
          set -euo pipefail
          node -e '
            // `node --version` prints a leading "v" ("v24.14.0"); npm does not.
            // A pre-release suffix is ignored: only (major, minor, patch) matter
            // for the minimum-version comparison.
            const semver = (raw) => {
              const m = /^v?(\d+)\.(\d+)\.(\d+)/.exec(String(raw).trim());
              if (!m) return null;
              return [Number(m[1]), Number(m[2]), Number(m[3])];
            };
            const gte = (a, b) => a[0] !== b[0] ? a[0] > b[0] : (a[1] !== b[1] ? a[1] > b[1] : a[2] >= b[2]);
            const npmRaw = process.argv[1];
            const npmVer = semver(npmRaw);
            if (!npmVer) { console.error(`FAIL: cannot parse npm version ${npmRaw}`); process.exit(1); }
            const nodeRaw = process.argv[2];
            const nodeVer = semver(nodeRaw);
            if (!nodeVer) { console.error(`FAIL: cannot parse node version ${nodeRaw}`); process.exit(1); }
            const NPM_MIN = [11, 5, 1];
            const NODE_MIN = [22, 14, 0];
            if (!gte(npmVer, NPM_MIN)) {
              console.error(`FAIL: npm ${npmRaw} is older than the required ${NPM_MIN.join(".")}; trusted publishing cannot work`);
              process.exit(1);
            }
            if (!gte(nodeVer, NODE_MIN)) {
              console.error(`FAIL: node ${nodeRaw} is older than the required ${NODE_MIN.join(".")}`);
              process.exit(1);
            }
            console.log(`PASS npm ${npmRaw} >= ${NPM_MIN.join(".")}, node ${nodeRaw} >= ${NODE_MIN.join(".")}`);
          ' "$(npm --version)" "$(node --version)"
      - name: Parse every shipped JavaScript file
        # The published shim shipped with a truncated arrow function in
        # index.js and no CI step ever parsed JavaScript, so the SyntaxError
        # reached the registry as axiomize@1.12.2.
        run: |
          node --check index.js
          node --check bin/axiomize.js
          node --check tests/npm/contract.test.js
      - name: npm package contract tests
        run: npm test
      - name: npm/Python version lockstep and registry contract
        # Fails closed on version disagreement between package.json,
        # pyproject.toml, CHANGELOG and __init__, and --check-registry fails
        # closed if this exact version is already on npm. npm versions are
        # immutable, so a republish attempt can never succeed and would leave
        # the two registries permanently out of step.
        run: python .github/scripts/npm_release_contract.py --check-registry
      - name: Assert the tarball contains only the allowlisted files
        # `files` in package.json is the allowlist. Without this assertion npm
        # would silently fall back to .gitignore and pack the entire checkout.
        run: |
          set -euo pipefail
          npm pack --dry-run --json | python -c "
          import json, sys
          names = sorted(e['path'] for e in json.load(sys.stdin)[0]['files'])
          print('packed files:')
          for name in names:
              print('  ' + name)
          expected = {
              'index.js', 'bin/axiomize.js', 'package.json',
              'LICENSE', 'README.md', 'tests/npm/contract.test.js',
          }
          actual = set(names)
          missing = expected - actual
          if missing:
              raise SystemExit(f'FAIL: npm tarball is missing {sorted(missing)}')
          extra = actual - expected
          if extra:
              raise SystemExit(f'FAIL: npm tarball has unexpected files {sorted(extra)}')
          print(f'PASS npm tarball contains exactly the {len(names)} allowlisted files')
          "
      - name: Publish to npm (OIDC trusted publishing)
        if: steps.select-mode.outputs.mode == 'oidc'
        # No NODE_AUTH_TOKEN: npm's CLI authenticates from the job's OIDC
        # identity. Provenance is generated automatically for OIDC publishes
        # from a public repository; --provenance is explicit so the attestation
        # survives any future change to that default.
        # No continue-on-error: a failed publish must fail the release.
        run: npm publish --provenance --access public
      - name: Publish to npm (NPM_TOKEN fallback)
        if: steps.select-mode.outputs.mode == 'token'
        # --provenance is deliberately absent: provenance is backed by a Sigstore
        # attestation derived from the OIDC identity, and a long-lived token
        # cannot mint one. Passing the flag here would fail the publish.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  platform-smoke:
    name: release wheel-cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Enforce release version contract
        run: python .github/scripts/check_release_contract.py
      - name: Enforce npm package contract
        run: python .github/scripts/npm_release_contract.py
      - name: Build exact wheel
        # build is pinned here too, for the same reason as in preflight: the
        # wheel these jobs install and smoke must be byte-identical to the one
        # preflight validated, and an unpinned build backend makes that depend on
        # the day.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.1"
          python -m build --wheel
      - name: Install and smoke real wheel + CLI
        run: python .github/scripts/platform_wheel_cli_smoke.py --wheel-dir dist

  publish:
    needs: [preflight, platform-smoke, npm-package]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ needs.preflight.outputs.package_name }}/${{ needs.preflight.outputs.package_version }}/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist
      - name: Leave only wheel and sdist for PyPI
        run: find dist -type f ! -name '*.whl' ! -name '*.tar.gz' -delete
      - name: Check whether version already exists on PyPI
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          name="${{ needs.preflight.outputs.package_name }}"
          version="${{ needs.preflight.outputs.package_version }}"
          json_url="https://pypi.org/pypi/${name}/${version}/json"
          simple_url="https://pypi.org/simple/${name}/"
          normalized_name="$(python -c 'import re,sys; print(re.sub(r"[-_.]+", "_", sys.argv[1]))' "$name")"
          found=false
          if curl --retry 2 --retry-delay 2 -sfL "$json_url" > /dev/null; then
            found=true
            echo "Existing PyPI release found through JSON API: $json_url"
          else
            listing="$(mktemp)"
            if curl --retry 2 --retry-delay 2 -sfL "$simple_url" -o "$listing"; then
              if grep -Fqi "${normalized_name}-${version}" "$listing" || grep -Fqi "${name}-${version}" "$listing"; then
                found=true
                echo "Existing PyPI release found through Simple API: $simple_url"
              fi
            fi
            rm -f "$listing"
          fi
          echo "skip=$found" >> "$GITHUB_OUTPUT"
      - name: Detect API token fallback
        id: auth
        if: steps.gate.outputs.skip != 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI with Trusted Publishing
        id: trusted_publish
        if: steps.gate.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
        continue-on-error: true
      - name: Publish to PyPI with API token fallback
        id: token_publish
        if: steps.gate.outputs.skip != 'true' && steps.trusted_publish.outcome != 'success' && steps.auth.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
        continue-on-error: true
      - name: Fail clearly when PyPI authentication is not configured
        if: steps.gate.outputs.skip != 'true' && steps.trusted_publish.outcome != 'success' && steps.auth.outputs.has_token != 'true'
        shell: bash
        run: |
          echo "::error::PyPI authentication is not configured for this release."
          echo "::error::Configure a PyPI Trusted Publisher with owner=Furox-Art, repository=axiomize, workflow=release.yml, environment=pypi; or define the PYPI_API_TOKEN secret in the pypi environment."
          exit 1
      - name: Verify PyPI publication
        shell: bash
        run: |
          set -euo pipefail
          name="${{ needs.preflight.outputs.package_name }}"
          version="${{ needs.preflight.outputs.package_version }}"
          json_url="https://pypi.org/pypi/${name}/${version}/json"
          simple_url="https://pypi.org/simple/${name}/"
          normalized_name="$(python -c 'import re,sys; print(re.sub(r"[-_.]+", "_", sys.argv[1]))' "$name")"
          if [ "${{ steps.gate.outputs.skip }}" = "true" ]; then
            echo "PyPI publication verified before upload gate."
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            if curl -sfL "$json_url" > /dev/null; then
              echo "PyPI publication verified through JSON API: $json_url"
              exit 0
            fi
            listing="$(mktemp)"
            if curl -sfL "$simple_url" -o "$listing"; then
              if grep -Fqi "${normalized_name}-${version}" "$listing" || grep -Fqi "${name}-${version}" "$listing"; then
                rm -f "$listing"
                echo "PyPI publication verified through Simple API: $simple_url"
                exit 0
              fi
            fi
            rm -f "$listing"
            sleep 10
          done
          if [ "${{ steps.trusted_publish.outcome }}" = "success" ] || [ "${{ steps.token_publish.outcome }}" = "success" ]; then
            echo "::warning::PyPI public index/API propagation is delayed; upload action was accepted by PyPI and completed successfully."
            exit 0
          fi
          echo "::error::Neither an existing PyPI release nor a successful PyPI upload could be verified."
          exit 1
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.preflight.outputs.package_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sbom.spdx.json
