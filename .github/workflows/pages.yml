name: Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: Stage skill docs
        # SKILL.md and the perspective heads are written to be browsed inside
        # skills/axiomize/, so their relative links do not survive being
        # concatenated into a single docs/ page. Everything that is NOT staged
        # into docs/ is rewritten to an absolute GitHub URL.
        #
        # This lives in a script rather than inline shell so that a local
        # `mkdocs build --strict` and the CI docs job stage exactly the same
        # tree as this deploy. `mkdocs build --strict` keeps the result honest.
        run: python .github/scripts/stage_docs.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
