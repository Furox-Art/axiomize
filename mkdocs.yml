site_name: Axiomize
site_description: "Reproducible scientific modeling with explicit units, dimensional validation, numerical verification, and portable export for parameter estimation, calibration, sensitivity analysis, uncertainty quantification, and causal or Bayesian inference."
repo_url: https://github.com/Furox-Art/axiomize
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.sections
    - navigation.top

markdown_extensions:
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Workflow:
      - Adaptive workflow: adaptive-workflow.md
      - The workflow and lenses: skill.md
      - Rigor ladder: rigor.md
      - Archetypes: archetypes.md
  - Examples:
      - Example gallery: example-gallery.md
      - Worked examples index: examples.md
  - Reference:
      - Agent integration (MCP/REST/CLI): integrations.md
      - Portable export formats: portable-export.md
      - Reproducibility and interactive charts: repro-visibility.md
      - Benchmark results: benchmark-results.md
  - Security:
      - Trust boundaries: security.md
      - Security non-goals: security-non-goals.md
      - Patch versioning: security-versioning.md
  - Project:
      - Beginner walkthrough: tutorial.md
      - Agent tutorials: tutorials.md
      - Maintaining this documentation: documentation.md

# Maintainer-only pages. They stay in docs/ and keep building (README links some of
# them directly), but they are not user-facing navigation, so they are excluded from
# the site nav rather than listed in it.
exclude_docs: |
  publishing-checklist.md
  security-ci-contract.md
  security-maintenance.md
  security-release-checklist.md
  security-audit-1.11.2.md