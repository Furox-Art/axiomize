[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiomize"
version = "1.10.0"
description = "Turn any idea into a rigorous mathematical model - agent skill pack with 15+ modeling perspectives plus calibration, validation and benchmark tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Furox-Art", email = "177975472+Furox-Art@users.noreply.github.com" },
]
keywords = [
    "modeling",
    "simulation",
    "first-principles",
    "calibration",
    "sir",
    "gillespie",
    "monte-carlo",
    "erlang-c",
    "agent-skills",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "networkx>=3.0",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "z3-solver>=4.12",
    "control>=0.10",
    "cvxpy>=1.5",
    "casadi>=3.6",
]

[project.optional-dependencies]
full = [
    "pymc>=5.0",
    "jax>=0.4",
]
playground = [
    "gradio>=4.0",
    "pandas>=1.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Furox-Art/axiomize"
Repository = "https://github.com/Furox-Art/axiomize"
Issues = "https://github.com/Furox-Art/axiomize/issues"
Documentation = "https://furox-art.github.io/axiomize/"

[project.scripts]
axiomize = "axiomize.cli:main"
axiomize-validate = "axiomize.tools.validate:main"
axiomize-fit = "axiomize.tools.fit:main"
axiomize-csv-check = "axiomize.tools.csv_check:main"
axiomize-benchmark = "axiomize.tools.benchmark_runner:main"
axiomize-to-latex = "axiomize.tools.report_to_latex:main"
axiomize-index-reports = "axiomize.tools.index_reports:main"
axiomize-sweep = "axiomize.tools.parallel_sweep:main"

# check_skill.py is intentionally NOT an entry point: it is a repo-development
# linter that walks the filesystem around its own location, which is only
# meaningful inside a source checkout.

[tool.hatch.build.targets.wheel]
packages = ["src/axiomize"]

# Single source of truth: the wheel is assembled from the files that already
# live under skills/axiomize/ - nothing is duplicated into src/.
[tool.hatch.build.targets.wheel.force-include]
"skills/axiomize/tools" = "axiomize/tools"
"skills/axiomize/SKILL.md" = "axiomize/SKILL.md"
"skills/axiomize/adaptive-workflow.md" = "axiomize/adaptive-workflow.md"
"skills/axiomize/rigor.md" = "axiomize/rigor.md"
"skills/axiomize/archetypes.md" = "axiomize/archetypes.md"
"skills/axiomize/first-principles.md" = "axiomize/first-principles.md"
"skills/axiomize/perspectives" = "axiomize/perspectives"
"skills/axiomize/templates" = "axiomize/templates"
# Runtime data for the packaged axiomize-benchmark entry point.
"benchmarks/ideas.json" = "axiomize/data/benchmark_ideas.json"

[tool.hatch.build.targets.sdist]
exclude = [
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "dist",
    "site",
]

[tool.mypy]
python_version = "3.13"

# Third-party scientific wheels ship without stubs; probe them at runtime
# instead of type-checking their internals.
[[tool.mypy.overrides]]
module = [
    "sympy.*", "scipy.*", "numpy.*", "networkx.*", "statsmodels.*",
    "matplotlib.*", "z3.*", "control.*", "cvxpy.*", "casadi.*", "pymc", "fenics",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["casadi", "casadi.*"]
follow_imports = "skip"
ignore_missing_imports = true
ignore_errors = true
