[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiomize"
version = "1.12.3"
description = "Reproducible scientific modeling engine and agent skill pack: versioned Model IR with explicit units, dimensional and numerical validation, calibration, sensitivity and uncertainty analysis, causal/Bayesian inference, and portable export via CLI, REST and MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Furox-Art", email = "177975472+Furox-Art@users.noreply.github.com" },
]
keywords = [
    # what it does
    "modeling", "simulation", "scientific-computing", "mathematical-modeling",
    "first-principles", "calibration", "parameter-estimation", "system-identification",
    "sensitivity-analysis", "uncertainty-quantification", "cross-validation",
    "dimensional-analysis", "model-comparison", "surrogate-model",
    # method families
    "ode", "pde", "differential-equations", "finite-elements", "optimization",
    "bayesian", "causal-inference", "agent-based-modeling", "system-dynamics",
    # trust and delivery
    "reproducibility", "provenance", "verification", "validation", "mcp-server",
    "agent-skills", "rest-api", "modelica", "sbml", "cellml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "networkx>=3.0",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "z3-solver>=4.13,<5; sys_platform == 'darwin'",
    "z3-solver>=4.12; sys_platform != 'darwin'",
    "control>=0.10",
    "cvxpy>=1.5",
    "casadi>=3.6",
]

[project.optional-dependencies]
full = ["pymc>=5.0", "jax>=0.4"]
playground = ["gradio>=4.0", "pandas>=1.5"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.9", "mypy==2.3.1"]

[project.urls]
Homepage = "https://github.com/Furox-Art/axiomize"
Repository = "https://github.com/Furox-Art/axiomize"
Documentation = "https://furox-art.github.io/axiomize/"
Changelog = "https://github.com/Furox-Art/axiomize/blob/main/CHANGELOG.md"
Issues = "https://github.com/Furox-Art/axiomize/issues"
Security = "https://github.com/Furox-Art/axiomize/blob/main/SECURITY.md"
Contributing = "https://github.com/Furox-Art/axiomize/blob/main/CONTRIBUTING.md"
Benchmarks = "https://github.com/Furox-Art/axiomize/tree/main/benchmarks/reports"

[project.scripts]
axiomize = "axiomize.cli:main"
axiomize-validate = "axiomize.tools.validate:main"
axiomize-fit = "axiomize.tools.fit:main"
axiomize-csv-check = "axiomize.tools.csv_check:main"
axiomize-benchmark = "axiomize.tools.benchmark_runner:main"
axiomize-to-latex = "axiomize.tools.report_to_latex:main"
axiomize-index-reports = "axiomize.tools.index_reports:main"
axiomize-sweep = "axiomize.tools.parallel_sweep:main"

[tool.hatch.build.targets.wheel]
packages = ["src/axiomize"]

[tool.hatch.build.targets.wheel.force-include]
"skills/axiomize/tools" = "axiomize/tools"
"skills/axiomize/SKILL.md" = "axiomize/SKILL.md"
"skills/axiomize/adaptive-workflow.md" = "axiomize/adaptive-workflow.md"
"skills/axiomize/rigor.md" = "axiomize/rigor.md"
"skills/axiomize/archetypes.md" = "axiomize/archetypes.md"
"skills/axiomize/first-principles.md" = "axiomize/first-principles.md"
"skills/axiomize/perspectives" = "axiomize/perspectives"
"skills/axiomize/templates" = "axiomize/templates"
"benchmarks/ideas.json" = "axiomize/data/benchmark_ideas.json"

[tool.hatch.build.targets.sdist]
# Ship only what is needed to rebuild and verify the distribution. The previous
# defaults produced a 268-file sdist that carried the whole CI configuration,
# the test suite and the documentation images (including a 248 KB GIF), none of
# which a downstream packager needs.
include = [
    "src/axiomize",
    "skills/axiomize",
    "benchmarks/ideas.json",
    "tests",
    "conftest.py",
    "pyproject.toml",
    "requirements-test.txt",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "CITATION.cff",
]
exclude = [".mypy_cache", ".pytest_cache", ".ruff_cache", "dist", "site"]

[tool.pytest.ini_options]
# Fail on a collection error instead of skipping the broken module: a test file
# that cannot import the package is a failure, not a silent deselection.
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = false
source = ["axiomize"]
# The editable-install layout force-includes skills/axiomize/tools into the
# wheel; measure the package the tests import.
omit = [
    "*/tests/*",
    "*/.github/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Enforced by .github/scripts/quality_ratchet.py against the recorded baseline,
# so a drop in coverage fails CI instead of going unnoticed.
fail_under = 69

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".mypy_cache", ".pytest_cache", ".ruff_cache", "dist", "site"]

[tool.ruff.lint]
# Curated set, enforced as a ratchet rather than a zero-findings gate: see
# .github/scripts/quality_ratchet.py and .github/quality-baseline.json.
select = ["E4", "E7", "E9", "F", "B", "SIM", "I", "UP"]
# E701/E702 are the codebase's deliberate compact-statement style and E741 is
# the conventional `I` for the infected compartment in the epidemiological
# solvers. None of them indicate a defect.
ignore = ["E701", "E702", "E741"]

[tool.ruff.lint.per-file-ignores]
# conftest.py must register import roots before test modules import the package.
"conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = [
    "sympy.*", "scipy.*", "numpy.*", "networkx.*", "statsmodels.*",
    "matplotlib.*", "z3.*", "control.*", "cvxpy.*", "casadi.*", "pymc", "fenics", "dolfin.*",
    "dolfinx.*", "ufl", "ufl.*", "petsc4py", "petsc4py.*", "mpi4py", "mpi4py.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["casadi", "casadi.*"]
follow_imports = "skip"
ignore_missing_imports = true
ignore_errors = true
